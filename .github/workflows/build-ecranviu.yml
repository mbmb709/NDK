name: Build EcranViu APK
on:
  push:
    branches:
      - ecranviu-apk-build-2026
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract source and build
        run: |
          tar -xJf EcranViu-src.tar.xz
          cd EcranViu
          gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: EcranViu-APK
          path: EcranViu/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error